<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimnasio - Socios</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>GIMNASIO</h1>
        <a href="dashboard.html">Dashboard</a>
        <a class="solo-admin" href="usuarios.html">Usuarios</a>
        <div id="sesion"></div>
    </header>

    <main>
        <!-- Aquí aparecen los mensajes de éxito o error -->
        <div id="mensaje"></div>

        <section>
            <h2>Socios</h2>
            <form id="form-busqueda" onsubmit="buscarSocios(event)">
                <div class="campos">
                    <label>Nombre o CI <input id="busqueda" type="search"></label>
                    <label>Estado
                        <select id="estado-busqueda">
                            <option value="">Todos excepto cancelados</option>
                            <option>Activo</option>
                            <option>Por vencer</option>
                            <option>Vencido</option>
                            <option>Congelado</option>
                            <option>Cancelado</option>
                        </select>
                    </label>
                </div>
                <button type="submit">Buscar</button>
                <button type="button" onclick="limpiarBusqueda()">Limpiar</button>
            </form>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre y Apellido</th>
                            <th>CI</th>
                            <th>Plan</th>
                            <th>Vence</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <!-- Las filas las rellena cargarSocios() en app.js -->
                    <tbody id="tabla-socios"></tbody>
                </table>
            </div>
        </section>

        <section class="solo-admin">
            <h2>Precios de los planes</h2>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Plan</th>
                            <th>Días</th>
                            <th>Precio</th>
                            <th></th>
                        </tr>
                    </thead>
                    <!-- Las filas las rellena cargarPrecios() en app.js -->
                    <tbody id="tabla-precios"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>Nuevo socio</h2>
            <form id="form-alta" onsubmit="darDeAlta(event)">
                <div class="campos">
                    <label>Nombre y Apellido <input id="nombre" required></label>
                    <label>CI <input id="ci" required></label>
                    <label>Teléfono <input id="telefono"></label>
                    <label>Peso (kg) <input id="peso" type="number" step="0.1" required></label>
                    <label>Altura (m) <input id="altura" type="number" step="0.01" placeholder="1.75" required></label>
                    <label>Objetivo
                        <select id="objetivo">
                            <option value="bajar peso">Bajar peso</option>
                            <option value="ganar musculo">Ganar músculo</option>
                            <option value="mantenerse">Mantenerse</option>
                        </select>
                    </label>
                    <label>Nivel
                        <select id="nivel">
                            <option value="principiante">Principiante</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                    </label>
                    <label>Plan
                        <!-- Las opciones las rellena cargarPlanes() en app.js -->
                        <select id="plan"></select>
                    </label>
                </div>
                <button type="submit">Dar de alta</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        // Al abrir la página: mostrar la sesión, y cargar la tabla y los planes del desplegable
        mostrarSesion();
        cargarSocios();
        cargarPlanes("plan", null);
        cargarPrecios();
    </script>
</body>
</html>
