<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierro - Socios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <div class="barra">
            <a class="marca" href="index.html"><span class="logo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/><path d="M2.5 9.5v5M21.5 9.5v5M8 12h8"/></svg></span> Hierro</a>
            <nav>
                <a class="actual" href="index.html">Socios</a>
                <a href="dashboard.html">Dashboard</a>
                <a class="solo-admin" href="planes.html">Planes</a>
                <a class="solo-admin" href="usuarios.html">Usuarios</a>
            </nav>
            <div id="sesion"></div>
        </div>
    </header>

    <main>
        <div class="encabezado">
            <div>
                <h1>Socios</h1>
                <p class="subtitulo">Buscá un socio, registrá su entrada o abrí su ficha.</p>
            </div>
        </div>

        <!-- Aquí aparecen los mensajes de éxito o error -->
        <div id="mensaje"></div>

        <section>
            <form id="form-busqueda" class="busqueda" onsubmit="buscarSocios(event)">
                <div class="campos">
                    <label>Nombre o CI <input id="busqueda" type="search"></label>
                    <label>Estado
                        <select id="estado-busqueda">
                            <option value="">Todos excepto cancelados</option>
                            <option>Activo</option>
                            <option>Por vencer</option>
                            <option>Vencido</option>
                            <option>Congelado</option>
                            <option>Cancelado</option>
                        </select>
                    </label>
                </div>
                <button type="submit">Buscar</button>
                <button type="button" class="secundario" onclick="limpiarBusqueda()">Limpiar</button>
            </form>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre y Apellido</th>
                            <th>CI</th>
                            <th>Plan</th>
                            <th>Vence</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <!-- Las filas las rellena cargarSocios() en app.js -->
                    <tbody id="tabla-socios"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>Nuevo socio</h2>
            <p class="nota">El plan empieza a contar desde hoy.</p>
            <form id="form-alta" onsubmit="darDeAlta(event)">
                <div class="campos">
                    <label>Nombre y Apellido <input id="nombre" required></label>
                    <label>CI <input id="ci" required></label>
                    <label>Teléfono <input id="telefono"></label>
                    <label>Peso (kg) <input id="peso" type="number" step="0.1" required></label>
                    <label>Altura (m) <input id="altura" type="number" step="0.01" placeholder="1.75" required></label>
                    <label>Objetivo
                        <select id="objetivo">
                            <option value="bajar peso">Bajar peso</option>
                            <option value="ganar musculo">Ganar músculo</option>
                            <option value="mantenerse">Mantenerse</option>
                        </select>
                    </label>
                    <label>Nivel
                        <select id="nivel">
                            <option value="principiante">Principiante</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                    </label>
                    <label>Plan
                        <!-- Las opciones las rellena cargarPlanes() en app.js -->
                        <select id="plan"></select>
                    </label>
                </div>
                <button type="submit">Dar de alta</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        // Al abrir la página: mostrar la sesión, y cargar la tabla y los planes del desplegable
        mostrarSesion();
        cargarSocios();
        cargarPlanes("plan", null);
    </script>
</body>
</html>
